<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"
    />
    <meta name="theme-color" content="#000000" />

    <title>YourBank - Payroll Lending</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" />
    <script src="https://cdn.truv.com/bridge.js"></script>
    <style>
      :root {
        --primary-blue: #4169E1;
        --text-primary: #1A1A1A;
        --text-secondary: #666666;
        --background-input: #F8F9FA;
      }

      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        background: #F5F5F5;
      }

      .app-container {
        width: 100%;
        max-width: 390px;
        min-height: 844px;
        background: white;
        padding: 48px 24px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        border-radius: 16px;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 32px;
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 20px;
        font-weight: 500;
        color: var(--primary-blue);
      }

      .logo-circle {
        width: 24px;
        height: 24px;
        background: var(--primary-blue);
        border-radius: 50%;
      }

      .progress-nav {
        display: flex;
        gap: 16px;
        margin-bottom: 40px;
      }

      .nav-item {
        font-size: 16px;
        color: var(--text-secondary);
        text-decoration: none;
        padding-bottom: 8px;
        border-bottom: 2px solid transparent;
      }

      .nav-item.active {
        color: var(--text-primary);
        border-bottom: 2px solid var(--primary-blue);
      }

      .title {
        font-size: 32px;
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: 8px;
      }

      .subtitle {
        font-size: 16px;
        color: var(--text-secondary);
        margin-bottom: 40px;
      }

      .form-group { margin-bottom: 24px; }
      .form-label { display: block; font-size: 16px; color: var(--text-primary); margin-bottom: 8px; }
      .form-input { width: 100%; padding: 16px; font-size: 16px; border: none; border-radius: 8px; background: var(--background-input); box-sizing: border-box; }

      .button {
        background: var(--primary-blue);
        color: white;
        border: none;
        padding: 16px;
        width: 100%;
        font-size: 16px;
        font-weight: 500;
        border-radius: 100px;
        cursor: pointer;
        margin-top: auto;
      }

      .button:hover { opacity: 0.9; }

      .spinner-container {
        position: fixed; top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(255, 255, 255, 0.8);
        display: flex; align-items: center; justify-content: center;
        z-index: 1000;
      }

      .hidden { display: none; }
      .screen { display: none; }
      .screen.active { display: flex; flex-direction: column; flex: 1; }
      #personalInfo.active { display: flex; flex-direction: column; }

      .data-section { background: var(--background-input); padding: 24px; border-radius: 8px; margin-top: 24px; }
      .employment-data { margin: 20px 0; }
      .data-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #E0E0E0; }
      .data-row:last-child { border-bottom: none; }
      .data-label { color: var(--text-secondary); font-weight: 500; }
      .data-value { color: var(--text-primary); font-weight: 600; }

      @media (max-width: 390px) {
        .app-container { min-height: 100vh; padding: 48px 16px; }
      }

      /* Order inline embed styles */
      body.order-flow { margin: 0; height: 100vh; overflow: hidden; }
      body.order-flow .header, body.order-flow .progress-nav { display: none; }
      body.order-flow .app-container { height: 100vh; min-height: unset; padding: 0; }
      #truv-embed { flex: 1; display: flex; flex-direction: column; min-height: 0; }
      #truv-embed iframe { flex: 1; border: none; }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <div class="spinner-container hidden">
      <div class="spinner-border" role="status">
        <span class="sr-only">Loading...</span>
      </div>
    </div>

    <div class="app-container">
      <header class="header">
        <div class="logo">
          <div class="logo-circle"></div>
          YourBank
        </div>
      </header>

      <nav class="progress-nav">
        <a href="#" class="nav-item active" onclick="showScreen('personalInfo', 0); return false;">My info</a>
        <a href="#" class="nav-item" onclick="showScreen('payrollLending', 1); return false;">Payroll Lending</a>
        <a href="#" class="nav-item" onclick="showScreen('pllComplete', 2); return false;">Review</a>
      </nav>

      <div id="personalInfo" class="screen active">
        <h1 class="title">Your information</h1>
        <p class="subtitle">Fill in your details to apply for a payroll loan.</p>

        <div class="form-group">
          <label class="form-label">First name</label>
          <input type="text" class="form-input" />
        </div>

        <div class="form-group">
          <label class="form-label">Last name</label>
          <input type="text" class="form-input" />
        </div>

        <div class="form-group">
          <label class="form-label">Date of birth</label>
          <input type="date" class="form-input" />
        </div>

        <div class="form-group">
          <label class="form-label">Social security number</label>
          <input type="text" class="form-input" pattern="[0-9]*" />
        </div>

        <button class="button" onclick="showPayrollLending()">
          Continue
        </button>
      </div>

      <div id="payrollLending" class="screen">
        <div id="truv-embed"></div>
      </div>

      <div id="pllComplete" class="screen">
        <div class="data-section">
          <h3>Please review your data</h3>
          <div id="accountData" class="employment-data">
            <div class="data-row">
              <span class="data-label">Account Type:</span>
              <span class="data-value" id="accountType"></span>
            </div>
            <div class="data-row">
              <span class="data-label">Account Number:</span>
              <span class="data-value" id="accountNumber"></span>
            </div>
            <div class="data-row">
              <span class="data-label">Routing Number:</span>
              <span class="data-value" id="routingNumber"></span>
            </div>
            <div class="data-row">
              <span class="data-label">Deposit Type:</span>
              <span class="data-value" id="depositType"></span>
            </div>
            <div class="data-row">
              <span class="data-label">Deposit Amount:</span>
              <span class="data-value" id="depositAmount"></span>
            </div>
            <div class="data-row">
              <span class="data-label">Initial Deposit:</span>
              <span class="data-value" id="initialDeposit"></span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      let currentStep = 0;

      function showScreen(screenId, navIndex) {
        if (navIndex > currentStep) return;
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
        document.querySelector('.nav-item.active').classList.remove('active');
        document.querySelectorAll('.nav-item')[navIndex].classList.add('active');
        currentStep = navIndex;
      }

      function showPayrollLending() {
        currentStep = 1;
        showScreen('payrollLending', 1);
        document.body.classList.add('order-flow')
        if (window.bridge) bridge.open();
      }

      function getApiRequests(apiEndpoint) {
        const headers = { "Content-Type": "application/json;charset=UTF-8" }

        const getBridgeToken = async () => {
          const response = await fetch(apiEndpoint + `getBridgeToken`, { method: "get", headers }).then(r => r.json())
          console.table(response)
          return response
        }

        const getOrderData = async (orderId) => {
          const response = await fetch(apiEndpoint + `getOrderData/${orderId}`, { method: "get", headers }).then(r => r.json())
          console.table(response)
          return response
        }

        return { getBridgeToken, getOrderData }
      }

      const apiRequests = getApiRequests("{{ server_url }}")

      ;(async function () {
        // Step 2 - Call back end to create an order and get bridge token
        const order = await apiRequests.getBridgeToken()
        const orderId = order.id

        // Step 3 - Initialize the Truv Bridge
        const bridge = TruvBridge.init({
          bridgeToken: order.bridge_token,
          isOrder: true,
          position: { type: 'inline', container: document.getElementById('truv-embed') },
          onLoad: function () {
            console.log("[TruvBridge] onLoad")
          },
          onEvent: function (eventType, payload, source) {
            console.log(`[TruvBridge] onEvent: ${eventType}`, { source, payload })
          },
          onSuccess: function () {
            console.log("[TruvBridge] onSuccess")
          },
          onClose: async function () {
            console.log("[TruvBridge] onClose")
            await fetchAndRenderOrderData()
          },
        })

        async function fetchAndRenderOrderData() {
          if (window.orderComplete) return
          window.orderComplete = true
          document.body.classList.remove('order-flow')

          const content = document.querySelector(".spinner-container")
          content.classList.remove("hidden")

          let orderData
          try {
            orderData = await apiRequests.getOrderData(orderId)
          } catch (e) {
            console.error(e)
            content.classList.add("hidden")
            showScreen('personalInfo', 0)
            return
          }
          content.classList.add("hidden")

          if (orderData?.employers?.length) {
            renderOrderData(orderData)
          } else {
            showScreen('personalInfo', 0)
          }
        }

        window.bridge = bridge
      })()

      function renderOrderData(orderData) {
        const employer = orderData.employers[0]
        const depositDetails = employer?.employments?.[0]?.deposit_details || {}

        // Capitalize helper
        function capitalize(str) {
          return str ? str.charAt(0).toUpperCase() + str.slice(1) : '';
        }

        // Mask account number except last 4 digits
        function maskAccountNumber(num) {
          if (!num) return 'N/A';
          const str = String(num);
          return '•••• ' + str.slice(-4);
        }

        // Format deposit amount
        function formatAmount(val) {
          if (!val || isNaN(val)) return '';
          return '$' + Number(val).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
        }

        document.getElementById("accountType").textContent = capitalize(depositDetails.account_type) || "N/A";
        document.getElementById("accountNumber").textContent = maskAccountNumber(depositDetails.account_number);
        document.getElementById("routingNumber").textContent = depositDetails.routing_number || "N/A";
        document.getElementById("depositType").textContent = capitalize(depositDetails.deposit_type) || "N/A";
        document.getElementById("depositAmount").textContent = depositDetails.deposit_value
          ? formatAmount(depositDetails.deposit_value)
          : (depositDetails.deposit_type === 'entire' ? 'Entire paycheck' : 'N/A');
        document.getElementById("initialDeposit").textContent = "Scheduled";

        document.getElementById("payrollLending").classList.remove('active');
        document.getElementById("pllComplete").classList.add('active');
        currentStep = 2;
        document.querySelector('.nav-item.active').classList.remove('active');
        document.querySelectorAll('.nav-item')[2].classList.add('active');
      }
    </script>
  </body>
</html>
