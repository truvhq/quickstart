<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Truv Quickstart — Application</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="/shared/styles.css" />
  <script src="https://cdn.truv.com/bridge.js"></script>
  <style>
    /* Override shared variables to match original Application design */
    :root {
      --primary: #1a56db;
      --primary-hover: #1648b8;
      --primary-light: #eff6ff;
      --bg: #ffffff;
      --bg-white: #ffffff;
      --bg-input: #ffffff;
      --text-secondary: #6b7280;
      --text-muted: #9ca3af;
      --success: #059669;
      --success-bg: #ecfdf5;
    }

    /* Header */
    .header-left { display: flex; align-items: center; gap: 12px; }
    .header-logo { width: 20px; height: 20px; background: var(--primary); border-radius: 50%; }
    .header-title { font-size: 16px; font-weight: 600; }
    .header-badge { font-size: 12px; color: var(--text-secondary); background: #f3f4f6; padding: 4px 10px; border-radius: 12px; }

    /* Layout */
    .app-panel { justify-content: center; padding: 40px 32px; }
    .app-panel.no-pad { padding: 0; }
    .app-content { width: 100%; max-width: 520px; transition: max-width 0.2s; height: 100%; }
    .app-content.full-width { max-width: 100%; }

    /* API panel — pill-style tabs */
    .api-panel { min-width: 0; overflow: hidden; }
    .api-panel-tabs { padding: 16px 20px; gap: 2px; border-bottom: 1px solid var(--border); }
    .api-panel-tabs button { flex: none; padding: 6px 14px; font-size: 12px; font-weight: 600; color: var(--text-muted); border-radius: 6px; border-bottom: none; transition: all 0.15s; }
    .api-panel-tabs button:hover { color: var(--text-secondary); background: #f3f4f6; }
    .api-panel-tabs button.active { color: var(--primary); background: var(--primary-light); border-bottom: none; }
    .api-tab-content { padding: 16px 20px; }

    /* Form */
    .form-row { display: grid; gap: 16px; margin-bottom: 16px; }
    .form-row-2 { grid-template-columns: 1fr 1fr; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label, label.form-label { font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 0; }
    .form-group input, input.form-input { padding: 10px 14px; background: #fff; font-family: inherit; }
    .form-group input:focus, input.form-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(26,86,219,0.1); }
    input.form-input::placeholder { color: var(--text-muted); }

    /* Checkbox */
    .checkbox-row { display: flex; align-items: center; gap: 10px; margin: 24px 0; }
    .checkbox-row input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--primary); cursor: pointer; }
    .checkbox-row label { font-size: 13px; color: var(--text-secondary); cursor: pointer; }
    .checkbox-row label a { color: var(--primary); text-decoration: underline; }

    /* Buttons */
    .btn { padding: 12px 24px; font-weight: 600; font-family: inherit; }
    .btn-primary { width: 100%; }
    .btn-primary:disabled { opacity: 0.4; }
    .btn-outline { background: transparent; border: 1.5px solid var(--border); color: var(--text); }
    .btn-outline:hover { border-color: var(--primary); color: var(--primary); background: transparent; }

    /* Bridge embed */
    .bridge-wrapper { width: 100%; height: 100%; border: none; border-radius: 0; overflow: hidden; position: relative; background: #fff; zoom: 0.85; }
    .bridge-wrapper iframe { width: 100% !important; height: 100% !important; border: none; }

    /* Waiting screen */
    .waiting-ring { border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 1.2s linear infinite; }
    .webhook-pill { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: #f3f4f6; border-radius: var(--radius-sm); margin-bottom: 8px; font-size: 13px; animation: fadeIn 0.3s ease; }
    .webhook-pill .wp-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .webhook-pill .wp-dot.green { background: var(--success); }
    .webhook-pill .wp-dot.yellow { background: var(--warning); }
    .webhook-pill .wp-dot.blue { background: #3b82f6; }
    .webhook-pill .wp-text { flex: 1; font-weight: 500; }
    .webhook-pill .wp-time { font-size: 11px; color: var(--text-muted); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

    /* Results */
    .results-grid { display: grid; gap: 0; margin-bottom: 20px; }
    .result-row { display: grid; grid-template-columns: 180px 1fr; border-bottom: 1px solid var(--border-light); }
    .result-label { padding: 12px 0; font-size: 13px; color: var(--text-secondary); font-weight: 500; }
    .result-value { padding: 12px 0; font-size: 13px; font-weight: 600; }
    .result-section { margin-bottom: 24px; }
    .result-section h3 { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 12px; }
    .status-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
    .status-completed { background: var(--success-bg); color: var(--success); border: 1px solid #a7f3d0; }
    .status-pending { background: var(--warning-bg); color: var(--warning); }

    /* Guide blocks — styled for rich content */
    .guide-block { margin-bottom: 12px; padding: 16px; background: #f3f4f6; border-radius: var(--radius-sm); }
    .guide-block h4 { font-size: 14px; font-weight: 700; margin-bottom: 12px; }
    .guide-detail { font-size: 12px; color: var(--text-secondary); line-height: 1.7; }
    .guide-detail p { margin: 8px 0; }
    .guide-detail pre { background: #1a1a2e; color: #e2e8f0; padding: 10px 12px; border-radius: 6px; font-size: 11px; font-family: 'SF Mono', SFMono-Regular, Menlo, monospace; overflow-x: auto; white-space: pre; margin: 8px 0; line-height: 1.5; }
    .guide-detail code { background: rgba(0,0,0,0.06); padding: 1px 5px; border-radius: 3px; font-size: 11px; font-family: 'SF Mono', SFMono-Regular, Menlo, monospace; }
    .guide-detail pre code { background: none; padding: 0; }
    .guide-detail ul, .guide-detail ol { margin: 8px 0; padding-left: 20px; }
    .guide-detail li { margin: 4px 0; }
    .guide-detail h5 { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text); margin: 12px 0 4px; }
    .guide-detail a { color: var(--primary); font-weight: 500; }

    /* Headings */
    h2 { font-size: 24px; font-weight: 700; letter-spacing: -0.3px; margin-bottom: 6px; }
    .subtitle { font-size: 14px; color: var(--text-secondary); line-height: 1.6; margin-bottom: 28px; }

    /* Log entries — monospace endpoints */
    .api-log-endpoint { font-family: 'SF Mono', SFMono-Regular, Menlo, monospace; }
    .api-log-body pre { font-family: 'SF Mono', SFMono-Regular, Menlo, monospace; background: #f3f4f6; padding: 10px; border-radius: 6px; max-height: 200px; overflow-y: auto; }

    /* Tunnel info */
    .tunnel-info { background: #eff6ff; border: 1px solid #bfdbfe; }
    .tunnel-info span { color: #1e40af; font-weight: 600; }
    .tunnel-info a { color: #2563eb; }

    /* Small spinner for buttons */
    .spinner-sm { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block; }
  </style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="header-logo"></div>
    <div class="header-title">Truv Quickstart</div>
    <div class="header-badge">Application</div>
  </div>
</div>

<div class="main-layout">
  <div class="app-panel" id="appPanel">
    <div class="app-content" id="appContent">

      <!-- Step 0: Form -->
      <div id="stepForm">
        <h2>Tell us about yourself</h2>
        <p class="subtitle">Enter applicant details to create a verification order. The backend sends these to the Truv Orders API.</p>
        <div class="form-row form-row-2">
          <div class="form-group">
            <label class="form-label">First name</label>
            <input class="form-input" id="firstName" placeholder="Joe">
          </div>
          <div class="form-group">
            <label class="form-label">Last name</label>
            <input class="form-input" id="lastName" placeholder="Doe">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Email address</label>
            <input class="form-input" id="email" type="email" placeholder="joe@example.com">
          </div>
        </div>
        <div class="form-row form-row-2">
          <div class="form-group">
            <label class="form-label">Phone number</label>
            <input class="form-input" id="phone" type="tel" placeholder="123456789">
          </div>
          <div class="form-group">
            <label class="form-label">SSN (last 4)</label>
            <input class="form-input" id="ssn" placeholder="6789">
          </div>
        </div>
        <div class="checkbox-row">
          <input type="checkbox" id="agree" checked>
          <label for="agree">I agree to the <a href="#">Acme Terms of Service</a></label>
        </div>
        <button class="btn btn-primary" id="submitBtn" onclick="handleSubmit()" style="width:100%">Continue</button>
      </div>

      <!-- Step 1: Bridge -->
      <div id="stepBridge" class="hidden" style="width:100%;height:100%;">
        <div class="bridge-wrapper" id="bridgeContainer"></div>
      </div>

      <!-- Step 2: Waiting -->
      <div id="stepWaiting" class="hidden" style="display:none;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;text-align:center;">
        <div style="width:72px;height:72px;margin-bottom:28px;">
          <div class="waiting-ring" style="width:72px;height:72px;"></div>
        </div>
        <h2 style="margin-bottom:8px;">Waiting for webhooks</h2>
        <p style="font-size:14px;color:var(--text-secondary);line-height:1.6;max-width:400px;margin-bottom:36px;">Truv sends webhook events as the verification progresses. Watch them arrive in real time.</p>
        <div id="webhookFeed" style="text-align:left;width:100%;max-width:420px;"></div>
      </div>

      <!-- Step 3: Results -->
      <div id="stepResults" class="hidden"></div>

    </div>
  </div>

  <div id="apiPanel" class="api-panel"></div>
</div>

<script src="/shared/panel.js"></script>
<script>
// --- Guide steps (developer-authored static HTML) ---
var STEPS = [
  {
    title: 'Collect applicant info',
    guide: '<p>The form collects applicant PII and sends it to your backend. The server calls:</p>'
      + '<pre>POST /v1/orders/\n{\n  "first_name": "...",\n  "last_name": "...",\n  "products": ["income"],\n  "employers": [{ "company_name": "Home Depot" }]\n}</pre>'
      + '<p>The response contains a <code>bridge_token</code> used to initialize the Bridge widget, and an order <code>id</code> for polling results.</p>'
      + '<h5>Key fields</h5><ul>'
      + '<li><code>bridge_token</code> — single-use token to open Bridge</li>'
      + '<li><code>user_id</code> — identifies the user across webhooks</li>'
      + '<li><code>share_url</code> — shareable link for the applicant</li>'
      + '<li><code>template_id</code> — optional, for branded experience</li></ul>'
      + '<p><a href="https://docs.truv.com/reference/create-an-order" target="_blank">API Reference \u2192</a></p>',
  },
  {
    title: 'Bridge verification',
    guide: '<p>The Bridge widget is initialized with:</p>'
      + '<pre>TruvBridge.init({\n  bridgeToken: "...",\n  isOrder: true,\n  position: { type: "inline", container: el }\n})</pre>'
      + '<p>Bridge fires events as the user progresses:</p><ul>'
      + '<li><code>onLoad</code> — widget ready</li>'
      + '<li><code>onEvent(LOAD, OPEN, LINK_CREATED, ...)</code> — user actions</li>'
      + '<li><code>onEvent(COMPLETED, source: "order")</code> — verification done</li>'
      + '<li><code>onSuccess</code> / <code>onClose</code> — final callbacks</li></ul>'
      + '<p>Sandbox credentials: <code>goodlogin</code> / <code>goodpassword</code></p>'
      + '<p><a href="https://docs.truv.com/docs/bridge-overview" target="_blank">Bridge Docs \u2192</a></p>',
  },
  {
    title: 'Webhook processing',
    guide: '<p>Truv sends webhooks to your registered URL as the verification progresses. Events arrive in this order:</p><ol>'
      + '<li><code>order-created</code> — order is pending</li>'
      + '<li><code>task-status-updated</code> — login \u2192 parse \u2192 full_parse \u2192 done</li>'
      + '<li><code>link-connected</code> — payroll link established</li>'
      + '<li><code>profile-created</code>, <code>employment-created</code>, <code>statements-created</code>, <code>bank-accounts-created</code></li>'
      + '<li><code>order-status-updated</code> (status: completed) — all done</li></ol>'
      + '<p>All webhooks include <code>user_id</code> for matching. Verify the <code>X-Webhook-Sign</code> header with HMAC-SHA256.</p>'
      + '<pre>const sig = crypto\n  .createHmac(\'sha256\', API_SECRET)\n  .update(rawBody)\n  .digest(\'hex\');</pre>'
      + '<p><a href="https://docs.truv.com/docs/webhooks" target="_blank">Webhooks Docs \u2192</a></p>',
  },
  {
    title: 'Retrieve results',
    guide: '<p>Once the order is completed, fetch the full results:</p>'
      + '<pre>GET /v1/orders/{order_id}/</pre>'
      + '<p>The response includes nested <code>employers[]</code> with:</p><ul>'
      + '<li><strong>Profile</strong> — name, SSN, DOB, address</li>'
      + '<li><strong>Employment</strong> — title, start date, income, manager</li>'
      + '<li><strong>Pay Statements</strong> — gross/net pay, earnings, deductions per period</li>'
      + '<li><strong>W-2 Forms</strong> — annual wages and tax withholdings</li>'
      + '<li><strong>Bank Accounts</strong> — direct deposit routing info</li>'
      + '<li><strong>Annual Income Summary</strong> — aggregated by year</li></ul>'
      + '<p>You can also call <code>POST /v1/orders/{id}/refresh/</code> to re-pull data from the payroll provider.</p>'
      + '<p><a href="https://docs.truv.com/reference/get-an-order" target="_blank">API Reference \u2192</a></p>',
  },
];

// --- Panel ---
var panel = new QuickstartPanel({
  tabs: ['guide', 'api', 'bridge', 'webhooks'],
  steps: STEPS,
  onWebhook: function(wh) {
    if (state.step === 2) updateWaitingFeed();
  }
});

// --- State ---
var state = {
  step: 0, orderId: null, truvOrderId: null, userId: null,
  bridgeToken: null, productType: 'income', orderData: null
};

// --- Helpers ---
function $(amount) { return '$' + Number(amount).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function freq(f) { return { BW: 'Biweekly', W: 'Weekly', M: 'Monthly', SM: 'Semi-Monthly', A: 'Annual' }[f] || f; }

// --- Step switching ---
var screens = ['stepForm', 'stepBridge', 'stepWaiting', 'stepResults'];

function goStep(n) {
  state.step = n;
  panel.setStep(n);

  var appPanel = document.getElementById('appPanel');
  var appContent = document.getElementById('appContent');
  appPanel.className = n === 1 ? 'app-panel no-pad' : 'app-panel';
  appContent.className = n === 0 ? 'app-content' : 'app-content full-width';

  for (var i = 0; i < screens.length; i++) {
    var scr = document.getElementById(screens[i]);
    if (i === n) {
      scr.classList.remove('hidden');
      if (screens[i] === 'stepWaiting') scr.style.display = 'flex';
    } else {
      scr.classList.add('hidden');
      if (screens[i] === 'stepWaiting') scr.style.display = 'none';
    }
  }

  if (n === 1) setTimeout(initBridge, 100);
  if (n === 2) { waitingStartedAt = Date.now(); updateWaitingFeed(); }
  if (n === 3 && !state.orderData) setTimeout(fetchOrderData, 100);
  if (n === 3 && state.orderData) renderResults();
}

// --- Step 1: Submit form ---
async function handleSubmit() {
  if (!document.getElementById('agree').checked) return;
  var btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = '';
  var spinner = document.createElement('span');
  spinner.className = 'spinner-sm';
  btn.appendChild(spinner);

  var formData = {
    first_name: document.getElementById('firstName').value || undefined,
    last_name: document.getElementById('lastName').value || undefined,
    email: document.getElementById('email').value || undefined,
    phone: document.getElementById('phone').value || undefined,
    ssn: document.getElementById('ssn').value || undefined,
  };

  try {
    var resp = await fetch(API_BASE + '/api/orders', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...formData, product_type: state.productType }),
    });
    var data = await resp.json();
    if (!resp.ok) { alert('Error: ' + (data.error || 'Unknown')); btn.disabled = false; btn.textContent = 'Continue'; return; }
    state.orderId = data.order_id;
    state.truvOrderId = data.truv_order_id;
    state.userId = data.user_id;
    state.bridgeToken = data.bridge_token;
    panel.connectSSE(state.orderId);
    await panel.fetchLogs(state.orderId);
    goStep(1);
  } catch (e) { console.error(e); btn.disabled = false; btn.textContent = 'Continue'; }
}

// --- Step 2: Bridge ---
var bridgeInstance = null;

function initBridge() {
  if (!state.bridgeToken) return;
  bridgeInstance = TruvBridge.init({
    bridgeToken: state.bridgeToken,
    isOrder: true,
    position: { type: 'inline', container: document.getElementById('bridgeContainer') },
    onLoad: function() { panel.addBridgeEvent('onLoad', null); },
    onEvent: function(eventType, payload, source) {
      panel.addBridgeEvent('onEvent', { eventType: eventType, source: source });
      if (source === 'order' && eventType === 'COMPLETED') {
        setTimeout(async function() { await panel.fetchLogs(state.orderId); goStep(2); }, 1500);
      }
    },
    onSuccess: function() { panel.addBridgeEvent('onSuccess', null); },
    onClose: function() { panel.addBridgeEvent('onClose', null); },
  });
  if (bridgeInstance) bridgeInstance.open();
}

// --- Step 3: Waiting ---
var waitingStartedAt = null;
var WAITING_MIN_MS = 10000;

function updateWaitingFeed() {
  if (state.step !== 2) return;
  var feed = document.getElementById('webhookFeed');
  if (panel.webhooks.length === 0) {
    feed.textContent = 'No webhooks received yet...';
    feed.style.textAlign = 'center';
    feed.style.fontSize = '13px';
    feed.style.color = 'var(--text-muted)';
  } else {
    feed.style.textAlign = 'left';
    feed.style.fontSize = '';
    feed.style.color = '';
    feed.textContent = '';
    var reversed = panel.webhooks.slice().reverse();
    for (var i = 0; i < reversed.length; i++) {
      var w = reversed[i];
      var payload = typeof w.payload === 'string' ? JSON.parse(w.payload) : (w.payload || {});
      var eventType = payload.event_type || w.event_type || 'unknown';
      var status = payload.status || w.status || '';
      var ts = payload.event_created_at || payload.updated_at || w.received_at || '';
      var timeStr = ts ? new Date(ts).toLocaleTimeString() : '';
      var dotColor = status === 'completed' || status === 'done' ? 'green' : status === 'pending' ? 'yellow' : 'blue';

      var pill = document.createElement('div');
      pill.className = 'webhook-pill';
      var dot = document.createElement('div');
      dot.className = 'wp-dot ' + dotColor;
      pill.appendChild(dot);
      var text = document.createElement('span');
      text.className = 'wp-text';
      text.textContent = eventType.replace(/-/g, ' ');
      pill.appendChild(text);
      var time = document.createElement('span');
      time.className = 'wp-time';
      time.textContent = timeStr;
      pill.appendChild(time);
      feed.appendChild(pill);
    }
  }

  // Auto-advance
  var elapsed = Date.now() - waitingStartedAt;
  var isCompleted = panel.webhooks.some(function(w) {
    var p = typeof w.payload === 'string' ? JSON.parse(w.payload) : (w.payload || {});
    return p.event_type === 'order-status-updated' && p.status === 'completed';
  });
  if (isCompleted && elapsed >= WAITING_MIN_MS) {
    setTimeout(function() { waitingStartedAt = null; goStep(3); }, 1000);
  } else if (isCompleted) {
    setTimeout(function() { waitingStartedAt = null; goStep(3); }, WAITING_MIN_MS - elapsed + 1000);
  }
}

// --- Step 4: Results ---
function renderResults() {
  var container = document.getElementById('stepResults');
  var data = state.orderData || {};
  var raw = data.raw_response || {};

  container.textContent = '';

  var h2 = document.createElement('h2');
  h2.textContent = 'Verification Results';
  container.appendChild(h2);

  var subtitle = document.createElement('p');
  subtitle.className = 'subtitle';
  subtitle.textContent = 'Order ' + (data.truv_order_id || state.truvOrderId || '') + ' \u2022 ' + (raw.verification_type || state.productType || '') + ' \u2022 ' + (data.status || '');
  container.appendChild(subtitle);

  var employers = raw.employers || [];
  for (var ei = 0; ei < employers.length; ei++) {
    var emp = employers[ei];
    var employment = (emp.employments && emp.employments[0]) || {};
    var profile = employment.profile || {};
    var company = employment.company || {};
    var stmts = employment.statements || [];
    var annualSummary = employment.annual_income_summary || [];
    var bankAccounts = employment.bank_accounts || [];
    var w2s = employment.w2s || [];

    // Employer header
    var empHeader = document.createElement('div');
    empHeader.style.cssText = 'display:flex;align-items:center;gap:12px;margin-bottom:20px;padding:16px 0;border-bottom:2px solid var(--border);';
    var logoUrl = emp.company_logo || (emp.provider && emp.provider.logo_url) || '';
    if (logoUrl) {
      var logo = document.createElement('img');
      logo.style.cssText = 'width:40px;height:40px;border-radius:8px;object-fit:contain;border:1px solid var(--border);';
      logo.src = logoUrl;
      empHeader.appendChild(logo);
    }
    var empInfo = document.createElement('div');
    var empName = document.createElement('div');
    empName.style.cssText = 'font-size:18px;font-weight:700;';
    empName.textContent = emp.company_name || company.name || 'Employer';
    empInfo.appendChild(empName);
    var meta = [emp.provider ? 'via ' + emp.provider.name : '', emp.data_source || ''].filter(Boolean).join(' \u2022 ');
    if (meta) {
      var metaEl = document.createElement('div');
      metaEl.style.cssText = 'font-size:13px;color:var(--text-secondary);margin-top:2px;';
      metaEl.textContent = meta;
      empInfo.appendChild(metaEl);
    }
    empHeader.appendChild(empInfo);
    var empStatus = document.createElement('span');
    empStatus.className = 'status-badge ' + (emp.status === 'completed' ? 'status-completed' : 'status-pending');
    empStatus.style.marginLeft = 'auto';
    empStatus.textContent = emp.status || '-';
    empHeader.appendChild(empStatus);
    container.appendChild(empHeader);

    // Profile section
    if (profile.first_name) {
      var sec = makeSection('Profile');
      var g = document.createElement('div'); g.className = 'results-grid';
      addRow(g, 'Full Name', profile.full_name || (profile.first_name + ' ' + profile.last_name));
      if (profile.email) addRow(g, 'Email', profile.email);
      if (profile.date_of_birth) addRow(g, 'Date of Birth', profile.date_of_birth);
      if (profile.ssn) addRow(g, 'SSN', profile.ssn.replace(/^(\d{3})(\d{2})(\d{4})$/, '$1-$2-$3'));
      if (profile.home_address) {
        var a = profile.home_address;
        addRow(g, 'Address', [a.street, a.city, a.state, a.zip].filter(Boolean).join(', '));
      }
      sec.appendChild(g); container.appendChild(sec);
    }

    // Employment section
    if (employment.job_title) {
      var sec2 = makeSection('Employment');
      var g2 = document.createElement('div'); g2.className = 'results-grid';
      addRow(g2, 'Job Title', employment.job_title);
      addRow(g2, 'Job Type', employment.job_type === 'F' ? 'Full-time' : employment.job_type === 'P' ? 'Part-time' : employment.job_type || '-');
      addRow(g2, 'Status', employment.is_active ? 'Active' : 'Inactive');
      addRow(g2, 'Start Date', employment.start_date || '-');
      if (employment.end_date) addRow(g2, 'End Date', employment.end_date);
      if (employment.original_hire_date) addRow(g2, 'Original Hire Date', employment.original_hire_date);
      if (employment.employed_in_role) addRow(g2, 'Tenure', employment.employed_in_role);
      if (employment.manager_name) addRow(g2, 'Manager', employment.manager_name);
      if (employment.income) addRow(g2, 'Annual Income', $(employment.income));
      if (employment.pay_rate) addRow(g2, 'Pay Rate', $(employment.pay_rate) + ' ' + freq(employment.pay_frequency));
      if (company.phone) addRow(g2, 'Company Phone', company.phone);
      if (company.address) {
        var ca = company.address;
        addRow(g2, 'Company Address', [ca.street, ca.city, ca.state, ca.zip].filter(Boolean).join(', '));
      }
      sec2.appendChild(g2); container.appendChild(sec2);
    }

    // Annual Income Summary
    if (annualSummary.length > 0) {
      var sec3 = makeSection('Annual Income Summary');
      var table = document.createElement('table');
      table.style.cssText = 'width:100%;border-collapse:collapse;font-size:13px;';
      var thead = document.createElement('tr');
      thead.style.cssText = 'border-bottom:2px solid var(--border);';
      ['Year', 'Gross Pay', 'Net Pay', 'Regular', 'Overtime', 'Other'].forEach(function(h) {
        var th = document.createElement('th');
        th.style.cssText = 'text-align:left;padding:8px 12px;font-weight:600;color:var(--text-secondary);';
        th.textContent = h;
        thead.appendChild(th);
      });
      table.appendChild(thead);
      annualSummary.forEach(function(yr) {
        var tr = document.createElement('tr');
        tr.style.cssText = 'border-bottom:1px solid var(--border-light);';
        [String(yr.year), $(yr.gross_pay), $(yr.net_pay), yr.regular ? $(yr.regular) : '-', yr.overtime ? $(yr.overtime) : '-', yr.other_pay ? $(yr.other_pay) : '-'].forEach(function(v, i) {
          var td = document.createElement('td');
          td.style.cssText = 'padding:8px 12px;' + (i === 0 ? 'font-weight:600;' : '');
          td.textContent = v;
          tr.appendChild(td);
        });
        table.appendChild(tr);
      });
      sec3.appendChild(table); container.appendChild(sec3);
    }

    // Pay Statements
    if (stmts.length > 0) {
      var sec4 = makeSection('Pay Statements (' + stmts.length + ' total)');
      var recent = stmts.slice(0, 3);
      recent.forEach(function(st) {
        var stCard = document.createElement('div');
        stCard.style.cssText = 'border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:12px;overflow:hidden;';

        var stHeader = document.createElement('div');
        stHeader.style.cssText = 'display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--border-light);cursor:pointer;';
        stHeader.onclick = function() { var b = this.nextElementSibling; b.style.display = b.style.display === 'none' ? 'block' : 'none'; };
        var hLeft = document.createElement('div');
        hLeft.style.cssText = 'font-weight:600;font-size:13px;';
        hLeft.textContent = 'Pay Date: ' + st.pay_date;
        stHeader.appendChild(hLeft);
        var hRight = document.createElement('div');
        hRight.style.cssText = 'display:flex;gap:16px;font-size:13px;';
        hRight.textContent = 'Gross: ' + $(st.gross_pay) + '  Net: ' + $(st.net_pay);
        stHeader.appendChild(hRight);
        stCard.appendChild(stHeader);

        var stBody = document.createElement('div');
        stBody.style.cssText = 'display:none;padding:12px 16px;';
        var sg = document.createElement('div'); sg.className = 'results-grid'; sg.style.marginBottom = '12px';
        addRow(sg, 'Period', (st.period_start || '') + ' to ' + (st.period_end || ''));
        addRow(sg, 'Hours', String(st.hours || '-'));
        addRow(sg, 'Regular', st.regular ? $(st.regular) : '-');
        addRow(sg, 'Overtime', st.overtime ? $(st.overtime) : '-');
        stBody.appendChild(sg);

        if (st.earnings && st.earnings.length) {
          stBody.appendChild(makeSubheading('Earnings'));
          var et = document.createElement('table'); et.style.cssText = 'width:100%;font-size:12px;border-collapse:collapse;';
          st.earnings.forEach(function(e) {
            var tr = document.createElement('tr'); tr.style.cssText = 'border-bottom:1px solid var(--border-light);';
            var td1 = document.createElement('td'); td1.style.cssText = 'padding:4px 8px;'; td1.textContent = e.name; tr.appendChild(td1);
            var td2 = document.createElement('td'); td2.style.cssText = 'padding:4px 8px;text-align:right;font-weight:500;'; td2.textContent = $(e.amount); tr.appendChild(td2);
            et.appendChild(tr);
          });
          stBody.appendChild(et);
        }
        if (st.deductions && st.deductions.length) {
          stBody.appendChild(makeSubheading('Deductions'));
          var dt = document.createElement('table'); dt.style.cssText = 'width:100%;font-size:12px;border-collapse:collapse;';
          st.deductions.forEach(function(d) {
            var tr = document.createElement('tr'); tr.style.cssText = 'border-bottom:1px solid var(--border-light);';
            var td1 = document.createElement('td'); td1.style.cssText = 'padding:4px 8px;'; td1.textContent = d.name; tr.appendChild(td1);
            var td2 = document.createElement('td'); td2.style.cssText = 'padding:4px 8px;text-align:right;font-weight:500;color:var(--error);'; td2.textContent = '-' + $(d.amount); tr.appendChild(td2);
            dt.appendChild(tr);
          });
          stBody.appendChild(dt);
        }
        if (st.file) {
          var dl = document.createElement('a');
          dl.href = st.file; dl.target = '_blank';
          dl.style.cssText = 'display:inline-block;margin-top:10px;font-size:12px;color:var(--primary);font-weight:500;';
          dl.textContent = 'Download PDF';
          stBody.appendChild(dl);
        }
        stCard.appendChild(stBody);
        sec4.appendChild(stCard);
      });
      if (stmts.length > 3) {
        var more = document.createElement('p');
        more.style.cssText = 'font-size:12px;color:var(--text-muted);';
        more.textContent = '+ ' + (stmts.length - 3) + ' more statements available in API response';
        sec4.appendChild(more);
      }
      container.appendChild(sec4);
    }

    // W-2s
    if (w2s.length > 0) {
      var sec5 = makeSection('W-2 Forms');
      var t2 = document.createElement('table');
      t2.style.cssText = 'width:100%;border-collapse:collapse;font-size:13px;';
      var th2 = document.createElement('tr');
      th2.style.cssText = 'border-bottom:2px solid var(--border);';
      ['Year', 'Wages', 'Federal Tax', 'SS Tax', 'Medicare Tax', ''].forEach(function(h) {
        var th = document.createElement('th');
        th.style.cssText = 'text-align:left;padding:8px 12px;font-weight:600;color:var(--text-secondary);';
        th.textContent = h;
        th2.appendChild(th);
      });
      t2.appendChild(th2);
      w2s.forEach(function(w) {
        var tr = document.createElement('tr');
        tr.style.cssText = 'border-bottom:1px solid var(--border-light);';
        var cells = [String(w.year), w.wages ? $(w.wages) : '-', w.federal_tax ? $(w.federal_tax) : '-', w.social_security_tax ? $(w.social_security_tax) : '-', w.medicare_tax ? $(w.medicare_tax) : '-'];
        cells.forEach(function(v, i) {
          var td = document.createElement('td');
          td.style.cssText = 'padding:8px 12px;' + (i === 0 ? 'font-weight:600;' : '');
          td.textContent = v;
          tr.appendChild(td);
        });
        var dlTd = document.createElement('td');
        dlTd.style.cssText = 'padding:8px 12px;';
        if (w.file) {
          var pdfLink = document.createElement('a');
          pdfLink.href = w.file; pdfLink.target = '_blank';
          pdfLink.style.cssText = 'color:var(--primary);font-weight:500;font-size:12px;';
          pdfLink.textContent = 'PDF';
          dlTd.appendChild(pdfLink);
        }
        tr.appendChild(dlTd);
        t2.appendChild(tr);
      });
      sec5.appendChild(t2); container.appendChild(sec5);
    }

    // Bank Accounts
    if (bankAccounts.length > 0) {
      var sec6 = makeSection('Bank Accounts');
      var g6 = document.createElement('div'); g6.className = 'results-grid';
      bankAccounts.forEach(function(ba, i) {
        addRow(g6, 'Account ' + (i + 1), (ba.bank_name || '') + ' \u2022 ' + (ba.account_type === 'C' ? 'Checking' : 'Savings') + ' \u2022 ...' + (ba.account_number || '').slice(-4));
        addRow(g6, 'Deposit', (ba.deposit_type === 'A' ? 'Amount: ' : 'Percent: ') + $(ba.deposit_value));
      });
      sec6.appendChild(g6); container.appendChild(sec6);
    }
  }

  // No employers
  if (employers.length === 0) {
    var sec7 = makeSection('Order Details');
    var g7 = document.createElement('div'); g7.className = 'results-grid';
    addRow(g7, 'Order ID', data.truv_order_id || state.truvOrderId || '-');
    addRow(g7, 'Status', data.status || '-');
    addRow(g7, 'Product', raw.verification_type || state.productType || '-');
    sec7.appendChild(g7); container.appendChild(sec7);
  }

  // Actions
  var actions = document.createElement('div');
  actions.style.cssText = 'display:flex;gap:12px;margin-top:24px;padding-top:20px;padding-bottom:48px;border-top:1px solid var(--border);';
  var refreshBtn = document.createElement('button');
  refreshBtn.className = 'btn btn-outline';
  refreshBtn.textContent = 'Refresh Data';
  refreshBtn.onclick = refreshOrder;
  actions.appendChild(refreshBtn);
  var newBtn = document.createElement('button');
  newBtn.className = 'btn btn-outline';
  newBtn.textContent = 'New Application';
  newBtn.onclick = resetApp;
  actions.appendChild(newBtn);
  container.appendChild(actions);
}

// DOM helper: create a result section with title
function makeSection(title) {
  var sec = document.createElement('div'); sec.className = 'result-section';
  var h3 = document.createElement('h3'); h3.textContent = title;
  sec.appendChild(h3); return sec;
}

// DOM helper: add a label/value row to a grid
function addRow(grid, label, value) {
  var row = document.createElement('div'); row.className = 'result-row';
  var l = document.createElement('div'); l.className = 'result-label'; l.textContent = label;
  var v = document.createElement('div'); v.className = 'result-value'; v.textContent = String(value);
  row.appendChild(l); row.appendChild(v); grid.appendChild(row);
}

// DOM helper: subheading for earnings/deductions
function makeSubheading(text) {
  var node = document.createElement('div');
  node.style.cssText = 'font-size:12px;font-weight:600;color:var(--text-secondary);margin:8px 0 4px;text-transform:uppercase;letter-spacing:0.5px;';
  node.textContent = text;
  return node;
}

function resetApp() {
  state = { step: 0, orderId: null, truvOrderId: null, userId: null, bridgeToken: null, productType: state.productType, orderData: null };
  document.getElementById('firstName').value = '';
  document.getElementById('lastName').value = '';
  document.getElementById('email').value = '';
  document.getElementById('phone').value = '';
  document.getElementById('ssn').value = '';
  document.getElementById('submitBtn').disabled = false;
  document.getElementById('submitBtn').textContent = 'Continue';
  document.getElementById('bridgeContainer').textContent = '';
  panel.apiLogs = [];
  panel.bridgeEvents = [];
  panel.webhooks = [];
  panel.setStep(0);
  panel.render();
  goStep(0);
}

async function fetchOrderData() {
  if (!state.orderId) return;
  try {
    var resp = await fetch(API_BASE + '/api/orders/' + encodeURIComponent(state.orderId));
    state.orderData = await resp.json();
    await panel.fetchLogs(state.orderId);
    renderResults();
  } catch (e) { console.error(e); }
}

async function refreshOrder() {
  if (!state.orderId) return;
  state.orderData = null;
  var container = document.getElementById('stepResults');
  container.textContent = '';
  var wrap = document.createElement('div');
  wrap.style.cssText = 'text-align:center;padding:60px;';
  var ring = document.createElement('div');
  ring.className = 'waiting-ring';
  ring.style.cssText = 'width:40px;height:40px;margin:0 auto 12px;';
  wrap.appendChild(ring);
  var p = document.createElement('p');
  p.style.cssText = 'font-size:14px;color:var(--text-secondary);';
  p.textContent = 'Loading results...';
  wrap.appendChild(p);
  container.appendChild(wrap);
  try {
    await fetch(API_BASE + '/api/orders/' + encodeURIComponent(state.orderId) + '/refresh', { method: 'POST' });
    await new Promise(function(r) { setTimeout(r, 1000); });
    await fetchOrderData();
  } catch (e) { console.error(e); }
}

// --- Init ---
fetch(API_BASE + '/api/config').then(function(r) { return r.json(); }).then(function(d) { state.productType = d.product_type; }).catch(function() {});
panel.connectGlobalSSE(function(wh) {
  var payload = typeof wh.payload === 'string' ? JSON.parse(wh.payload) : (wh.payload || {});
  if (state.userId && payload.user_id && payload.user_id !== state.userId) return false;
  return true;
});
goStep(0);
</script>
</body>
</html>
